<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Car Sales Simulator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:#fff;font:15px Arial,sans-serif}canvas{display:block}
#hud{position:fixed;z-index:5;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{background:#101827e8;border:1px solid #ffffff38;border-radius:12px;padding:10px;font-weight:bold;box-shadow:0 4px 16px #0003}
#help{position:fixed;z-index:5;top:62px;left:10px;max-width:260px;font-size:12px;line-height:1.45}
#controls{position:fixed;z-index:6;bottom:14px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
.group{display:flex;gap:8px;pointer-events:auto}.ctrl{height:62px;min-width:62px;border:1px solid #ffffff66;border-radius:14px;background:#17263de8;color:white;font-weight:bold;font-size:20px;touch-action:none;user-select:none}.pedal{min-width:74px;font-size:13px;background:#17613be8}
#actions{position:fixed;z-index:7;left:50%;top:52%;transform:translate(-50%,-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:94%;pointer-events:none}
#actions button,#office button,#customerPanel button{pointer-events:auto;border:0;border-radius:10px;padding:12px 14px;background:#efb23b;color:#171717;font-weight:bold;font-size:14px}
#toast{display:none;position:fixed;z-index:9;top:18%;left:50%;transform:translateX(-50%);background:#101827ed;padding:11px 16px;border-radius:12px;text-align:center;max-width:90%;font-weight:bold}
#office,#customerPanel{display:none;position:fixed;z-index:10;inset:0;background:#07101bee;align-items:center;justify-content:center;padding:18px}
.card{width:min(430px,100%);background:#192a40;padding:20px;border-radius:17px;border:1px solid #ffffff44;line-height:1.5;box-shadow:0 18px 55px #0008}
.card h2{margin-top:0}.secondary{background:#53657b!important;color:white!important}
#customerChoices{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
#vehiclePanel{display:none;position:fixed;z-index:11;inset:0;background:#07101bf2;align-items:center;justify-content:center;padding:18px}.specGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.spec{background:#ffffff12;padding:10px;border-radius:9px}.spec b{display:block;color:#ffd36b;font-size:12px;margin-bottom:3px}#vehiclePanel button,#office button{margin:4px 3px}#hud{align-items:flex-start}#dayInfo{font-size:12px;opacity:.9}
@media(max-width:420px){.pill{padding:8px;font-size:13px}#help{max-width:220px}.ctrl{min-width:56px;height:56px}.pedal{min-width:66px}}
\n#hud .pill{backdrop-filter:blur(12px);border-color:#ffffff55}#help{backdrop-filter:blur(10px)}.ctrl{box-shadow:0 7px 20px #0005,inset 0 1px #ffffff35}.ctrl:active{transform:translateY(2px);filter:brightness(1.25)}#actions button{box-shadow:0 8px 22px #0005;background:linear-gradient(135deg,#ffd36b,#e99a25)}\n</style>
</head>
<body>
<div id="hud"><div class="pill">🚘 CAR SALES SIMULATOR</div><div class="pill" id="cash">💵 $25,000</div></div>
<div id="help" class="pill">Walk: WASD / arrows · Approach a car to inspect, wash, repair, list, buy or test-drive it.<div id="driveInfo"></div></div>
<div id="actions"></div><div id="toast"></div>
<div id="controls">
 <div class="group"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div>
 <div class="group"><button class="ctrl pedal" id="brake">BRAKE</button><button class="ctrl pedal" id="gas">GAS</button></div>
</div>
<div id="customerPanel"><div class="card"><h2 id="customerTitle">Customer</h2><p id="customerText"></p><div id="customerChoices"></div><button class="secondary" id="leaveCustomer">Close</button></div></div>
<div id="office"><div class="card"><h2>🏢 Dealership Office</h2><p>Manage your business, review the numbers and start a new business day.</p><p id="stats"></p><button id="nextDay">🌅 End day & collect revenue</button><button id="closeOffice" class="secondary">Back to showroom</button></div></div>
<div id="vehiclePanel"><div class="card"><h2 id="vehicleTitle">Vehicle inspection</h2><div id="vehicleSpecs" class="specGrid"></div><p id="vehicleAdvice"></p><button id="closeVehicle" class="secondary">Close inspection</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
"use strict";
const toastEl=document.getElementById("toast");
const actions=document.getElementById("actions");
if(!window.THREE){toastEl.style.display="block";toastEl.textContent="3D engine could not load. Check your internet connection and reload.";return;}
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bbdd1);
scene.fog=new THREE.Fog(0x9bbdd1,48,115);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,220);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
renderer.domElement.style.position="fixed";
renderer.domElement.style.inset="0";
renderer.domElement.style.zIndex="0";
document.body.appendChild(renderer.domElement);
function mat(color,roughness,metalness){return new THREE.MeshStandardMaterial({color:color,roughness:roughness===undefined?.65:roughness,metalness:metalness||0});}
function addBox(w,h,d,x,y,z,material,parent){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;
 (parent||scene).add(mesh);return mesh;
}
scene.add(new THREE.HemisphereLight(0xffffff,0x667080,1.9));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(-18,32,18);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),mat(0x788b78));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(110,16),mat(0x343b43));
road.rotation.x=-Math.PI/2;road.position.set(0,.025,-26);scene.add(road);
for(let x=-50;x<55;x+=9){const stripe=new THREE.Mesh(new THREE.PlaneGeometry(4,.16),mat(0xf4f0dc));stripe.rotation.x=-Math.PI/2;stripe.position.set(x,.04,-26);scene.add(stripe);}
const glass=new THREE.MeshStandardMaterial({color:0x8fc4d9,roughness:.2,metalness:.12,transparent:true,opacity:.72});
addBox(30,7,12,0,3.5,-13,mat(0xd9dfe4));
addBox(32,.55,13,0,7.15,-13,mat(0x27374b));
addBox(9,.3,.3,0,5.8,-6.7,mat(0xf0b53c));
for(let x=-10;x<=10;x+=5)addBox(3.8,4.2,.12,x,3.1,-6.85,glass);
addBox(6,2.2,.2,0,1.25,-6.7,mat(0x26384a));
const signCanvas=document.createElement("canvas");signCanvas.width=512;signCanvas.height=128;
const signCtx=signCanvas.getContext("2d");signCtx.fillStyle="#192a40";signCtx.fillRect(0,0,512,128);
signCtx.fillStyle="white";signCtx.font="bold 54px Arial";signCtx.textAlign="center";signCtx.fillText("AUTO DEALER",256,82);
const sign=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(signCanvas)}));
sign.position.set(0,5.1,-6.4);sign.scale.set(8,2,1);scene.add(sign);

// Premium showroom upgrade: layered lighting, glass frontage, landscaped forecourt and street furniture.
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.autoUpdate=true;
const fillLight=new THREE.DirectionalLight(0xd9eaff,.75);fillLight.position.set(22,18,8);scene.add(fillLight);
const showroomGlow=new THREE.PointLight(0xffdfaa,32,34,2);showroomGlow.position.set(0,5,-12);scene.add(showroomGlow);
const floorMat=new THREE.MeshStandardMaterial({color:0x9ca9b0,roughness:.32,metalness:.18});
const showroomFloor=new THREE.Mesh(new THREE.PlaneGeometry(27,10),floorMat);showroomFloor.rotation.x=-Math.PI/2;showroomFloor.position.set(0,.035,-12.2);scene.add(showroomFloor);
for(let x=-12;x<=12;x+=6){const lamp=new THREE.Mesh(new THREE.CylinderGeometry(.07,.11,5.5,12),mat(0x303b48,.3,.7));lamp.position.set(x,2.75,-20);scene.add(lamp);const glow=new THREE.Mesh(new THREE.SphereGeometry(.22,16,12),new THREE.MeshBasicMaterial({color:0xffe8b0}));glow.position.set(x,5.55,-20);scene.add(glow);}
function addTree(x,z,scale){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16*scale,.24*scale,1.7*scale,10),mat(0x65452e));trunk.position.set(x,.85*scale,z);scene.add(trunk);
 for(let j=0;j<3;j++){const crown=new THREE.Mesh(new THREE.IcosahedronGeometry((1.05-j*.13)*scale,2),new THREE.MeshStandardMaterial({color:j===1?0x39734c:0x285d40,roughness:.9}));crown.position.set(x,(1.8+j*.45)*scale,z);crown.castShadow=true;scene.add(crown);}
}
for(const p of [[-34,-12],[-34,5],[-34,22],[34,-12],[34,5],[34,22],[-24,-34],[24,-34]])addTree(p[0],p[1],.9+(Math.abs(p[0])%3)*.08);
const curbMat=mat(0xb8c0c4,.75);
for(const side of [-1,1]){const curb=new THREE.Mesh(new THREE.BoxGeometry(112,.22,.42),curbMat);curb.position.set(0,.12,-26+side*8.25);scene.add(curb);}
const brandPanel=addBox(12,1.35,.22,0,6.1,-6.45,mat(0x142b42,.28,.45));

const parkingLine=mat(0xf4f0dc);
for(let x=-19;x<=19;x+=9){const q=new THREE.Mesh(new THREE.PlaneGeometry(.12,13),parkingLine);q.rotation.x=-Math.PI/2;q.position.set(x,.04,4);scene.add(q);}
function roundedFootprint(w,d,r){
 const sh=new THREE.Shape();
 sh.moveTo(-w/2+r,-d/2);sh.lineTo(w/2-r,-d/2);sh.quadraticCurveTo(w/2,-d/2,w/2,-d/2+r);
 sh.lineTo(w/2,d/2-r);sh.quadraticCurveTo(w/2,d/2,w/2-r,d/2);
 sh.lineTo(-w/2+r,d/2);sh.quadraticCurveTo(-w/2,d/2,-w/2,d/2-r);
 sh.lineTo(-w/2,-d/2+r);sh.quadraticCurveTo(-w/2,-d/2,-w/2+r,-d/2);return sh;
}
function makeCar(color,name,price,x,z){
 const group=new THREE.Group(),paint=new THREE.MeshPhysicalMaterial({color,roughness:.24,metalness:.58,clearcoat:1,clearcoatRoughness:.12}),dark=mat(0x101820,.22,.35),rubber=mat(0x111318,.88),chrome=mat(0xc5d2dc,.2,.85),glassMat=new THREE.MeshPhysicalMaterial({color:0x172d40,roughness:.12,metalness:.35,transparent:true,opacity:.88});
 function part(w,h,d,px,py,pz,ma,radius){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d,2,2,2),ma);m.position.set(px,py,pz);group.add(m);m.castShadow=true;m.receiveShadow=true;return m;}
 const base=new THREE.Mesh(new THREE.ExtrudeGeometry(roundedFootprint(2.35,4.45,.34),{depth:.78,bevelEnabled:true,bevelSegments:4,steps:1,bevelSize:.13,bevelThickness:.12,curveSegments:12}),paint);
 base.rotation.x=-Math.PI/2;base.position.y=.08;group.add(base);base.castShadow=true;
 const cabin=new THREE.Mesh(new THREE.ExtrudeGeometry(roundedFootprint(1.82,2.15,.28),{depth:.78,bevelEnabled:true,bevelSegments:4,bevelSize:.08,bevelThickness:.1,curveSegments:12}),glassMat);
 cabin.rotation.x=-Math.PI/2;cabin.position.set(0,1.23,.12);group.add(cabin);
 part(1.9,.09,1.9,0,1.65,.12,paint);
 for(const side of [-1,1]){
  for(const zz of [-1.38,1.38]){
   const tire=new THREE.Mesh(new THREE.TorusGeometry(.39,.16,16,28),rubber);tire.rotation.y=Math.PI/2;tire.position.set(side*1.12,.48,zz);group.add(tire);tire.castShadow=true;
   const rim=new THREE.Mesh(new THREE.CylinderGeometry(.255,.255,.13,24),chrome);rim.rotation.z=Math.PI/2;rim.position.copy(tire.position);rim.position.x=side*1.19;group.add(rim);
   const hub=new THREE.Mesh(new THREE.CylinderGeometry(.105,.105,.145,20),dark);hub.rotation.z=Math.PI/2;hub.position.copy(rim.position);group.add(hub);
   for(let k=0;k<8;k++){const spoke=new THREE.Mesh(new THREE.BoxGeometry(.035,.22,.045),chrome);spoke.position.set(side*1.27,.48+Math.sin(k*Math.PI/4)*.13,zz+Math.cos(k*Math.PI/4)*.13);spoke.rotation.x=k*Math.PI/4;group.add(spoke);}
  }
 }
 for(const side of [-1,1]){
  const head=new THREE.Mesh(new THREE.BoxGeometry(.48,.16,.08),new THREE.MeshPhysicalMaterial({color:0xfff4d6,emissive:0xffd77a,emissiveIntensity:.35}));head.position.set(side*.77,.86,-2.23);group.add(head);
  const tail=new THREE.Mesh(new THREE.BoxGeometry(.48,.16,.08),new THREE.MeshStandardMaterial({color:0xd71924,emissive:0x690000,emissiveIntensity:.4}));tail.position.set(side*.77,.86,2.23);group.add(tail);
  const mirror=part(.22,.13,.28,side*1.02,1.32,-.55,paint);
 }
 part(1.7,.1,.12,0,.62,-2.28,chrome);part(1.7,.1,.12,0,.62,2.28,chrome);
 const roof=part(1.48,.09,1.35,0,2.02,.15,paint);
 group.position.set(x,0,z);scene.add(group);group.userData={name,price,owned:false};return group;
}
const cars=[
 makeCar(0xc72e2e,"Falcon S",8500,-13,2),
 makeCar(0x2476c9,"Vortex GT",14500,-4,2),
 makeCar(0xd8d8d8,"Metro LX",11200,5,2),
 makeCar(0xe0aa2e,"Ranger X",19800,14,2),
 makeCar(0x398b63,"Trail Master",17500,-22,2),
 makeCar(0x633e9c,"Night Runner",22500,22,2)
];
let cash=25000,rep=1,day=1,selected=null,dayRevenue=0,dayExpenses=0,marketMood=1,showroomLevel=1;
cars.forEach(function(c,i){c.userData.condition=[86,94,78,91,83,97][i];c.userData.mileage=[68400,31200,92500,45800,73100,18900][i];c.userData.cleanliness=[72,95,58,88,67,99][i];c.userData.listed=false;c.userData.daysOwned=0;});
try{const saved=JSON.parse(localStorage.getItem("carDealerSave")||"null");if(saved){cash=Number(saved.cash)||cash;rep=Number(saved.rep)||rep;day=Number(saved.day)||day;if(Array.isArray(saved.owned))cars.forEach((c,i)=>c.userData.owned=!!saved.owned[i]);if(Array.isArray(saved.condition))cars.forEach((c,i)=>c.userData.condition=saved.condition[i]||c.userData.condition);if(Array.isArray(saved.mileage))cars.forEach((c,i)=>c.userData.mileage=saved.mileage[i]||c.userData.mileage);if(Array.isArray(saved.cleanliness))cars.forEach((c,i)=>c.userData.cleanliness=saved.cleanliness[i]||c.userData.cleanliness);if(Array.isArray(saved.listed))cars.forEach((c,i)=>c.userData.listed=!!saved.listed[i]);dayRevenue=saved.dayRevenue||0;dayExpenses=saved.dayExpenses||0;showroomLevel=saved.showroomLevel||1;}}catch(err){}
function save(){try{localStorage.setItem("carDealerSave",JSON.stringify({cash:cash,rep:rep,day:day,owned:cars.map(c=>c.userData.owned),condition:cars.map(c=>c.userData.condition),mileage:cars.map(c=>c.userData.mileage),cleanliness:cars.map(c=>c.userData.cleanliness),listed:cars.map(c=>c.userData.listed),dayRevenue:dayRevenue,dayExpenses:dayExpenses,showroomLevel:showroomLevel}));}catch(err){}}
function refresh(){document.getElementById("cash").textContent="💵 $"+cash.toLocaleString();save();}
function toast(message){toastEl.textContent=message;toastEl.style.display="block";clearTimeout(toastEl.timer);toastEl.timer=setTimeout(function(){toastEl.style.display="none";},2300);}
const player={x:0,z:13,yaw:Math.PI,driving:false,car:null,speed:0};
const avatar=new THREE.Group();
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.32,.8,4,8),mat(0x24538a));torso.position.y=1;avatar.add(torso);
const head=new THREE.Mesh(new THREE.SphereGeometry(.23,14,12),mat(0xd5a27d));head.position.y=1.65;avatar.add(head);scene.add(avatar);
const customerNames=["Alex","Mina","Sam","Nora","Leo"];
const customerColors=[0x315f9b,0x9a553c,0x397b58,0x76529b,0xb17b2e];
const customers=[];
for(let i=0;i<5;i++){
 const person=new THREE.Group();
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.25,.68,4,8),mat(customerColors[i]));body.position.y=.88;person.add(body);
 const face=new THREE.Mesh(new THREE.SphereGeometry(.19,12,10),mat(0xd4a17c));face.position.y=1.48;person.add(face);
 person.position.set(-17+i*8,0,-1+(i%2)*5);scene.add(person);
 customers.push({mesh:person,name:customerNames[i],budget:9000+i*3800,target:cars[(i+1)%cars.length],phase:i*.9,active:true});
}
let activeCustomer=null;
const customerPanel=document.getElementById("customerPanel");
document.getElementById("leaveCustomer").onclick=function(){customerPanel.style.display="none";activeCustomer=null;showActions();};
function addAction(label,callback){const button=document.createElement("button");button.textContent=label;button.onclick=callback;actions.appendChild(button);}
function nearestCar(){let best=null,bestDistance=5;for(const car of cars){const d=Math.hypot(car.position.x-player.x,car.position.z-player.z);if(d<bestDistance){bestDistance=d;best=car;}}return best;}
function nearestCustomer(){let best=null,bestDistance=3.5;for(const c of customers){if(!c.active)continue;const d=Math.hypot(c.mesh.position.x-player.x,c.mesh.position.z-player.z);if(d<bestDistance){bestDistance=d;best=c;}}return best;}
function buy(car){if(cars.filter(c=>c.userData.owned).length>=showroomLevel+2){toast("Showroom full. Upgrade your dealership first.");return;}if(cash<car.userData.price){toast("Not enough cash.");return;}cash-=car.userData.price;dayExpenses+=car.userData.price;car.userData.owned=true;car.userData.listed=true;car.userData.daysOwned=0;rep++;refresh();toast("Stock acquired: "+car.userData.name+". Prepare it for sale.");showActions();}
function sell(car){if(!car.userData.owned){toast("This car is not yours.");return;}const amount=Math.round(car.userData.price*(.52+car.userData.condition/330)*marketMood);cash+=amount;dayRevenue+=amount;car.userData.owned=false;car.userData.listed=false;rep+=2;refresh();toast("Vehicle sold for $"+amount.toLocaleString()+".");showActions();}
function drive(car){if(!car.userData.owned){toast("Buy this car before test-driving it.");return;}player.driving=true;player.car=car;player.x=car.position.x;player.z=car.position.z;player.yaw=car.rotation.y;player.speed=0;toast("Test drive started. Use GAS, BRAKE and arrows.");showActions();}
function exitCar(){player.driving=false;player.x=player.car.position.x+3;player.z=player.car.position.z;player.car=null;player.speed=0;showActions();}
function openOffice(){document.getElementById("stats").textContent="Cash: $"+cash.toLocaleString()+" · Reputation: "+rep+" · Stock: "+cars.filter(c=>c.userData.owned).length+" · Day "+day+" · Today sales: $"+dayRevenue.toLocaleString()+" · Expenses: $"+dayExpenses.toLocaleString()+" · Tier: "+(rep>=15?"Trusted dealer":rep>=6?"Local dealer":"New dealer")+" · Showroom level: "+showroomLevel;document.getElementById("office").style.display="flex";}
function finishDay(){const rent=650+showroomLevel*250,upkeep=cars.filter(c=>c.userData.owned).length*180;const net=dayRevenue-rent-upkeep;cash+=net;dayExpenses+=rent+upkeep;day++;marketMood=.88+Math.random()*.28;customers.forEach(function(c){c.active=true;c.mesh.visible=true;c.budget=Math.round(c.budget*(.94+Math.random()*.14));c.target=cars[Math.floor(Math.random()*cars.length)];});cars.forEach(function(c){if(c.userData.owned)c.userData.daysOwned++;});dayRevenue=0;refresh();toast("Day "+(day-1)+" closed. Net result: $"+net.toLocaleString()+".");openOffice();}
document.getElementById("closeOffice").onclick=function(){document.getElementById("office").style.display="none";};
document.getElementById("nextDay").onclick=finishDay;
document.getElementById("closeVehicle").onclick=function(){document.getElementById("vehiclePanel").style.display="none";};
function inspectCar(car){const u=car.userData;document.getElementById("vehicleTitle").textContent="🔍 "+u.name+" · vehicle report";document.getElementById("vehicleSpecs").innerHTML="<div class=spec><b>MARKET PRICE</b>$"+Math.round(u.price*marketMood).toLocaleString()+"</div><div class=spec><b>CONDITION</b>"+u.condition+"/100</div><div class=spec><b>MILEAGE</b>"+Math.round(u.mileage).toLocaleString()+" km</div><div class=spec><b>CLEANLINESS</b>"+u.cleanliness+"/100</div><div class=spec><b>STATUS</b>"+(u.owned?"Your inventory":"Available to buy")+"</div><div class=spec><b>LISTING</b>"+(u.listed?"On sale":"Not listed")+"</div>";document.getElementById("vehicleAdvice").textContent=u.condition<65?"Needs mechanical repair before a strong resale.":u.cleanliness<65?"A wash will improve showroom appeal.":"This vehicle is in presentable condition.";document.getElementById("vehiclePanel").style.display="flex";}
function serviceCar(car,kind){if(!car.userData.owned)return;const u=car.userData;if(kind==="wash"){if(cash<120){toast("A wash costs $120.");return;}cash-=120;dayExpenses+=120;u.cleanliness=Math.min(100,u.cleanliness+35);toast("Vehicle cleaned. Presentation improved.");}else{const cost=Math.round((100-u.condition)*95);if(cash<cost){toast("Repairs cost $"+cost.toLocaleString()+". Not enough cash.");return;}cash-=cost;dayExpenses+=cost;u.condition=100;toast("Inspection and repairs complete.");}refresh();showActions();}
function talkCustomer(c){
 if(player.driving)return;
 activeCustomer=c;
 const car=c.target;
 document.getElementById("customerTitle").textContent="🤝 "+c.name+" wants a car";
 document.getElementById("customerText").textContent="Budget: $"+c.budget.toLocaleString()+". Interested in "+car.userData.name+". Asking price: $"+car.userData.price.toLocaleString()+".";
 const choices=document.getElementById("customerChoices");choices.innerHTML="";
 const owned=cars.filter(function(item){return item.userData.owned;});
 function choice(label,fn){const b=document.createElement("button");b.textContent=label;b.onclick=fn;choices.appendChild(b);}
 const affordable=owned.filter(function(item){return item.userData.price<=c.budget*1.3;});
 if(!owned.length){choice("Showroom tour",function(){toast("Buy a car into stock first.");customerPanel.style.display="none";activeCustomer=null;});}
 else if(!affordable.length){choice("Offer a lower-priced car",function(){c.budget+=4500;talkCustomer(c);});}
 else{
  affordable.forEach(function(item){
   const conditionFactor=.72+item.userData.condition/360;const offer=Math.min(c.budget,Math.round(item.userData.price*conditionFactor*(item.userData.cleanliness<55?.94:1)));
   choice("Offer "+item.userData.name+" · $"+offer.toLocaleString(),function(){
    if(offer>=item.userData.price*(.55+item.userData.condition/500)){cash+=offer;dayRevenue+=offer;item.userData.owned=false;item.userData.listed=false;rep+=3;refresh();toast("Deal! "+c.name+" bought "+item.userData.name+" for $"+offer.toLocaleString()+".");c.active=false;c.mesh.visible=false;}
    else toast(c.name+" declined. Try a higher offer.");
    customerPanel.style.display="none";activeCustomer=null;showActions();
   });
  });
 }
 choice("Negotiate +10%",function(){c.budget=Math.round(c.budget*1.1);talkCustomer(c);});
 customerPanel.style.display="flex";
}
function showActions(){
 actions.innerHTML="";
 if(player.driving){addAction("EXIT VEHICLE",exitCar);return;}
 const visitor=nearestCustomer();
 if(visitor){addAction("TALK TO "+visitor.name,function(){talkCustomer(visitor);});return;}
 const car=nearestCar();
 if(car){
  selected=car;
  addAction("INSPECT / HISTORY",function(){inspectCar(car);});
  if(!car.userData.owned)addAction("BUY $"+car.userData.price.toLocaleString(),function(){buy(car);});
  else{addAction("TEST DRIVE",function(){drive(car);});addAction("WASH $120",function(){serviceCar(car,"wash");});addAction("REPAIR",function(){serviceCar(car,"repair");});addAction(car.userData.listed?"UNLIST FOR SALE":"LIST FOR SALE",function(){car.userData.listed=!car.userData.listed;toast(car.userData.name+(car.userData.listed?" listed for sale.":" removed from listing."));save();showActions();});addAction("SELL NOW",function(){sell(car);});}
 }else if(Math.hypot(player.x,player.z+13)<7)addAction("DEALERSHIP OFFICE",openOffice);
}
const keys={};
addEventListener("keydown",function(e){keys[e.key.toLowerCase()]=true;});
addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false;});
function hold(id,key){
 const element=document.getElementById(id);
 element.addEventListener("pointerdown",function(e){e.preventDefault();keys[key]=true;if(element.setPointerCapture)element.setPointerCapture(e.pointerId);});
 ["pointerup","pointercancel","lostpointercapture"].forEach(function(eventName){element.addEventListener(eventName,function(){keys[key]=false;});});
}
hold("left","left");hold("right","right");hold("gas","gas");hold("brake","brake");
let last=performance.now(),elapsed=0,actionClock=0;
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min((now-last)/1000,.04);last=now;elapsed+=dt;actionClock+=dt;
 customers.forEach(function(c){if(c.active&&!player.driving){c.phase+=dt*.45;const tx=Math.sin(c.phase*.7)*12;const tz=-2+Math.cos(c.phase*.55)*5;c.mesh.position.x+=(tx-c.mesh.position.x)*dt*.22;c.mesh.position.z+=(tz-c.mesh.position.z)*dt*.22;c.mesh.rotation.y=Math.atan2(tx-c.mesh.position.x,tz-c.mesh.position.z);}});
 const forward=keys.w||keys.arrowup,back=keys.s||keys.arrowdown,left=keys.a||keys.arrowleft||keys.left,right=keys.d||keys.arrowright||keys.right;
 if(player.driving){
  if(forward||keys.gas)player.speed=Math.min(14,player.speed+12*dt);
  else if(back||keys.brake)player.speed=Math.max(-4,player.speed-17*dt);
  else player.speed*=Math.pow(.95,dt*60);
  if(left)player.car.rotation.y+=2*dt*(player.speed>=0?1:-1);
  if(right)player.car.rotation.y-=2*dt*(player.speed>=0?1:-1);
  player.car.position.x+=Math.sin(player.car.rotation.y)*player.speed*dt;
  player.car.position.z+=Math.cos(player.car.rotation.y)*player.speed*dt;
  player.car.userData.mileage+=Math.abs(player.speed*dt)*.08;
  player.car.position.x=THREE.MathUtils.clamp(player.car.position.x,-45,45);
  player.car.position.z=THREE.MathUtils.clamp(player.car.position.z,-39,26);
  player.x=player.car.position.x;player.z=player.car.position.z;player.yaw=player.car.rotation.y;
 }else{
  const move=forward?1:back?-1:0;
  if(left)player.yaw+=2.3*dt;if(right)player.yaw-=2.3*dt;
  player.x=THREE.MathUtils.clamp(player.x+Math.sin(player.yaw)*move*7*dt,-28,28);
  player.z=THREE.MathUtils.clamp(player.z+Math.cos(player.yaw)*move*7*dt,-38,26);
  avatar.position.set(player.x,0,player.z);avatar.rotation.y=player.yaw;
 }
 const target=new THREE.Vector3(player.x-Math.sin(player.yaw)*8,player.driving?5:4.5,player.z-Math.cos(player.yaw)*8);
 camera.position.lerp(target,.13);camera.lookAt(player.x,1.2,player.z);
 const daylight=(Math.sin(elapsed*.035)+1)/2;sun.intensity=1.2+daylight*1.3;
 if(player.driving){const info=document.getElementById("driveInfo");if(info)info.textContent="Speed "+Math.abs(Math.round(player.speed*3.6))+" km/h · Odometer "+Math.round(player.car.userData.mileage).toLocaleString()+" km";}
 if(actionClock>.3){showActions();actionClock=0;}
 renderer.render(scene,camera);
}
camera.position.set(0,5,22);camera.lookAt(0,1,13);
refresh();showActions();requestAnimationFrame(loop);
addEventListener("resize",function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
})();
</script>
</body>
</html>
